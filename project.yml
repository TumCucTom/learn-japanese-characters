name: Maru
options:
  bundleIdPrefix: com.maru
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Maru:
    type: application
    platform: iOS
    sources:
      - path: Maru
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: Maru/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.maru.app
        CODE_SIGN_ENTITLEMENTS: Maru/Maru.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MaruWidgetExtension
      - package: SQLite.swift
        product: SQLite
    postCompileScripts: []

  MaruWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MaruWidget
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: MaruWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.maru.app.widget
        CODE_SIGN_ENTITLEMENTS: MaruWidget/MaruWidget.entitlements
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    dependencies:
      - package: SQLite.swift
        product: SQLite

  MaruTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MaruTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maru.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Maru

packages:
  SQLite.swift:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.15.0"
